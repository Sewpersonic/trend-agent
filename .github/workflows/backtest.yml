# Backtest: test de regels van de agent op de afgelopen 5 jaar echte koersen.
# Draait automatisch als de code van de agent verandert, of handmatig via
# Actions -> backtest -> Run workflow. Resultaten komen in backtest/resultaten/.
name: backtest

on:
  push:
    paths: ["src/**", "config/**", ".github/workflows/backtest.yml"]
  workflow_dispatch:
    inputs:
      years:
        description: "Aantal jaren terug"
        default: "5"

permissions:
  contents: write

concurrency:
  group: backtest   # eigen wachtrij: workflows kunnen elkaar nooit wegdrukken
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAPER_TRADING: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[backtest]"
      - name: Backtest
        run: |
          python -m trendagent backtest --years "${{ github.event.inputs.years || '5' }}"
          python -m trendagent backtest --years "${{ github.event.inputs.years || '5' }}" --strategie controles
          cat backtest/*/RAPPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Resultaten opslaan
        run: |
          git config user.name "trend-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/
          git diff --cached --quiet && exit 0
          git commit -m "Backtest $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Opslaan mislukt (poging $i), opnieuw over 15 seconden..."; sleep 15
          done
          git fetch -q origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then echo "Opslaan definitief mislukt"; exit 1; fi
