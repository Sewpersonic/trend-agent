# Backtest: test de regels van de agent op de afgelopen 5 jaar echte koersen.
# Draait automatisch als de code van de agent verandert, of handmatig via
# Actions -> backtest -> Run workflow. Resultaten komen in backtest/resultaten/.
name: backtest

on:
  push:
    branches: [main]
    # alleen als de regels van de bots veranderen (niet bij elke wijziging aan dashboard of rapporten: scheelt rekentijd)
    paths: ["src/trendagent/agent.py", "src/trendagent/signals.py", "src/trendagent/features.py", "src/trendagent/investor.py",
            "src/trendagent/strategies.py", "src/trendagent/portfolio.py", "src/trendagent/backtest.py",
            "src/trendagent/core/config.py", "config/productie.json", ".github/workflows/backtest.yml"]
  workflow_dispatch:
    inputs:
      years:
        description: "Aantal jaren terug"
        default: "10"

permissions:
  contents: write

concurrency:
  group: backtest   # eigen wachtrij: workflows kunnen elkaar nooit wegdrukken
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PAPER_TRADING: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[backtest]"
      - name: Backtest
        run: |
          python -m trendagent backtest --years "${{ github.event.inputs.years || '10' }}"
          python -m trendagent backtest --years "${{ github.event.inputs.years || '10' }}" --strategie controles
          cat backtest/*/RAPPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Resultaten opslaan
        run: bash scripts/opslaan.sh "Backtest $(date -u +%F)" backtest/
