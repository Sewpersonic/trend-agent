# Wekelijks onderzoek: test varianten van beide strategieën op 5 jaar echte koersen,
# analyseert wat de bots leren van hun eigen trades, en schrijft een rapport naar onderzoek/.
#
# Deze Action PAST NOOIT ZELF DE PRODUCTIE AAN. Op main mag hij alleen bestanden in onderzoek/
# opslaan; de controle hieronder breekt af als er iets anders gewijzigd zou worden.
# Vindt het onderzoek een bewezen verbetering, dan zet hij een VOORSTEL (pull request) klaar
# dat alleen config/productie.json wijzigt. Jij beslist: Merge = overnemen, Close = niet.
name: onderzoek

on:
  push:   # ook draaien als de onderzoekscode zelf verandert
    paths: [".github/workflows/research.yml", "src/trendagent/evaluation.py", "src/trendagent/learning.py"]
  schedule:
    - cron: "17 5 * * 6"   # zaterdag 05:17 UTC (07:17 Nederlandse zomertijd)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: onderzoek   # eigen wachtrij: workflows kunnen elkaar nooit wegdrukken
  cancel-in-progress: false

jobs:
  onderzoek:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PAPER_TRADING: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Onderzoek
        run: |
          python -m trendagent onderzoek --years 5
          cat onderzoek/LAATSTE.md >> "$GITHUB_STEP_SUMMARY"
      - name: Alleen onderzoek/ opslaan
        run: |
          git config user.name "trend-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add onderzoek/
          if git status --porcelain | grep -v "^?? " | grep -v " onderzoek/" | grep -q .; then
            echo "Onderzoek probeerde iets buiten onderzoek/ te wijzigen; afgebroken."
            git status --porcelain
            exit 1
          fi
          git diff --cached --quiet && exit 0
          git commit -m "Onderzoek $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Opslaan mislukt (poging $i), opnieuw over 15 seconden..."; sleep 15
          done
          git fetch -q origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then echo "Opslaan definitief mislukt"; exit 1; fi

      - name: Voorstel klaarzetten (alleen bij een bewezen verbetering)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(python -c "import json;print(len(json.load(open('onderzoek/aanbeveling.json'))))")" = "0" ]; then
            echo "Geen aanbeveling deze week."; exit 0
          fi
          BRANCH="voorstel/$(date -u +%F)"
          if gh pr list --state open --json headRefName --jq '.[].headRefName' | grep -q '^voorstel/'; then
            echo "Er staat al een open voorstel; eerst dat afhandelen."; exit 0
          fi
          git checkout -b "$BRANCH"
          set +e
          python -m trendagent voorstel --body /tmp/voorstel.md
          code=$?
          set -e
          if [ "$code" = "3" ]; then echo "Aanbeveling staat al in productie."; exit 0; fi
          if [ "$code" != "0" ]; then exit "$code"; fi
          git add config/productie.json
          if git status --porcelain | grep -v "^?? " | grep -v " config/productie.json" | grep -q .; then
            echo "Voorstel probeerde meer te wijzigen dan config/productie.json; afgebroken."; exit 1
          fi
          git commit -m "Voorstel uit onderzoek $(date -u +%F)"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Voorstel: verbetering gevonden in onderzoek $(date -u +%F)" \
            --body-file /tmp/voorstel.md
