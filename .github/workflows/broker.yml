# Met de hand: het oefenaccount (demo) van Trading 212 bedienen. Alleen nepgeld.
#   kijken          = verbinding testen en kijken, geen orders
#   orders uit      = de bot plaatst geen orders meer in het oefenaccount (alleen kijken)
#   orders aan      = het oefenaccount volgt de trend-agent weer elke avond
#   nu gelijkzetten = nu meteen gelijkzetten (alleen als orders aan staan)
name: broker

on:
  schedule:
    - cron: "7 7-20 * * 1-5"   # elk uur tijdens beurstijden (ma-vr), alleen kijken: verse stand voor het dashboard
  workflow_dispatch:
    inputs:
      actie:
        description: "Wat wil je doen?"
        type: choice
        options: ["kijken", "orders uit", "orders aan", "nu gelijkzetten"]
        default: "kijken"

permissions:
  contents: write

concurrency:
  # Het uurlijkse kijken heeft een eigen wachtrij, zodat het nooit een oefenronde uit de wachtrij kan duwen.
  group: ${{ github.event_name == 'schedule' && 'broker-kijken' || 'oefenronde' }}
  cancel-in-progress: false

jobs:
  broker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAPER_TRADING: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Orders aan of uit zetten
        if: github.event.inputs.actie == 'orders uit' || github.event.inputs.actie == 'orders aan'
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("config/broker.json")
          cfg = json.loads(p.read_text()) if p.exists() else {}
          cfg["orders_aan"] = "${{ github.event.inputs.actie }}" == "orders aan"
          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + "\n")
          print("orders_aan =", cfg["orders_aan"])
          PY
      - name: Oefenaccount Trading 212
        env:
          T212_DEMO_KEY: ${{ secrets.T212_DEMO_KEY }}
          T212_DEMO_SECRET: ${{ secrets.T212_DEMO_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python -m trendagent broker --live
          elif [ "${{ github.event.inputs.actie }}" = "nu gelijkzetten" ]; then python -m trendagent broker
          else python -m trendagent broker --check; fi
      - name: Cijfers voor het dashboard
        if: always()
        run: python -m trendagent dashboard || true
      - name: Opslaan
        if: always()
        run: |
          git config user.name "trend-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "schedule" ]; then FILES="state/broker_live.json dashboard/broker.json"; else FILES="state/broker.json state/broker_live.json state/t212_instrumenten.json config/broker.json dashboard/"; fi
          bash scripts/opslaan.sh "Oefenaccount Trading 212: ${{ github.event.inputs.actie || 'uurlijkse stand' }}" $FILES
