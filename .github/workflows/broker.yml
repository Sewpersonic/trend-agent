# Met de hand: de koppeling met het oefenaccount (demo) van Trading 212 testen of gelijkzetten. Alleen nepgeld.
name: broker

on:
  workflow_dispatch:
    inputs:
      alleen_kijken:
        description: "true = alleen verbinding testen en kijken, geen orders"
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: write

concurrency:
  group: oefenronde
  cancel-in-progress: false

jobs:
  broker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAPER_TRADING: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Oefenaccount Trading 212
        env:
          T212_DEMO_KEY: ${{ secrets.T212_DEMO_KEY }}
          T212_DEMO_SECRET: ${{ secrets.T212_DEMO_SECRET }}
        run: |
          if [ "${{ github.event.inputs.alleen_kijken }}" = "true" ]; then python -m trendagent broker --check; else python -m trendagent broker; fi
      - name: Verslag opslaan
        if: always()
        run: |
          git config user.name "trend-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/broker.json
          git diff --cached --quiet && exit 0
          git commit -m "Oefenaccount Trading 212: verslag"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done
