# De oefenronde: elke werkdag na het sluiten van de Amerikaanse beurs.
#
# De agent haalt de slotkoersen op, beslist wat hij met nepgeld koopt of
# verkoopt, en slaat de nep-portefeuille, het rapport en de auditlog op in
# de map state/. Die wijzigingen worden teruggezet in deze repository, zodat
# je elke dag in state/report.md ziet wat hij heeft gedaan.
#
# Handmatig starten of stoppen: tab "Actions" -> "practice" -> "Run workflow",
# en kies bij "action": run, kill of resume.
name: practice

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC, ma-vr (23:30 Nederlandse zomertijd)
  workflow_dispatch:
    inputs:
      action:
        description: "run = één ronde · kill = agent stoppen · resume = agent weer aanzetten"
        type: choice
        options: [run, kill, resume]
        default: run

permissions:
  contents: write   # nodig om de map state/ terug te zetten

concurrency:
  group: oefenronde   # eigen wachtrij: workflows kunnen elkaar nooit wegdrukken
  cancel-in-progress: false

jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAPER_TRADING: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Kill switch bedienen
        if: github.event.inputs.action == 'kill' || github.event.inputs.action == 'resume'
        run: |
          if [ "${{ github.event.inputs.action }}" = "kill" ]; then
            python -m trendagent kill "handmatig gestopt via GitHub"
          else
            python -m trendagent resume
          fi

      # De twee bots draaien los van elkaar: een fout in de ene stopt de andere niet.
      - name: Trend-agent
        if: github.event.inputs.action != 'kill' && github.event.inputs.action != 'resume'
        continue-on-error: true
        run: python -m trendagent run

      - name: Investeerder
        if: github.event.inputs.action != 'kill' && github.event.inputs.action != 'resume'
        continue-on-error: true
        run: python -m trendagent invest

      - name: Samenvatting
        if: always()
        run: |
          python -m trendagent health >> "$GITHUB_STEP_SUMMARY" || true
          if [ -f state/investeerder.md ]; then cat state/investeerder.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f state/report.md ]; then cat state/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Resultaat opslaan in de repository
        if: always()
        run: |
          git config user.name "trend-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ rapporten/
          if git diff --cached --quiet; then
            echo "Niets gewijzigd."
          else
            git commit -m "Oefenronde $(date -u +%F)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Opslaan mislukt (poging $i), opnieuw over 15 seconden..."; sleep 15
            done
            git fetch -q origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then echo "Opslaan definitief mislukt"; exit 1; fi
          fi

      # Laatste stap: maakt de run ROOD als een bot faalde of de koersdata onbetrouwbaar was.
      # GitHub stuurt je dan standaard een e-mail.
      - name: Gezondheidscontrole
        if: github.event.inputs.action != 'kill' && github.event.inputs.action != 'resume'
        run: python -m trendagent health --check
