# De oefenronde: elke werkdag na het sluiten van de Amerikaanse beurs.
#
# De agent haalt de slotkoersen op, beslist wat hij met nepgeld koopt of
# verkoopt, en slaat de nep-portefeuille, het rapport en de auditlog op in
# de map state/. Die wijzigingen worden teruggezet in deze repository, zodat
# je elke dag in state/report.md ziet wat hij heeft gedaan.
#
# Handmatig starten of stoppen: tab "Actions" -> "practice" -> "Run workflow",
# en kies bij "action": run, kill of resume.
name: practice

on:
  schedule:
    - cron: "17 22 * * 1-5"   # 22:17 UTC ma-vr, na sluiting VS (00:17 zomertijd, 23:17 wintertijd).
                              # Geen heel/half uur: dan is GitHub het drukst en starten runs vaak uren later.
  workflow_dispatch:
    inputs:
      action:
        description: "run = één ronde · kill = agent stoppen · resume = agent weer aanzetten · voorbeeld = rapport op een kopie (verandert niets)"
        type: choice
        options: [run, kill, resume, voorbeeld]
        default: run

permissions:
  contents: write   # nodig om de map state/ terug te zetten

concurrency:
  group: oefenronde   # eigen wachtrij: workflows kunnen elkaar nooit wegdrukken
  cancel-in-progress: false

jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAPER_TRADING: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: Kill switch bedienen
        if: github.event.inputs.action == 'kill' || github.event.inputs.action == 'resume'
        run: |
          if [ "${{ github.event.inputs.action }}" = "kill" ]; then
            python -m trendagent kill "handmatig gestopt via GitHub"
          else
            python -m trendagent resume
          fi

      # Voorbeeld: beide bots draaien op een KOPIE van state/. De echte nep-portefeuille blijft onaangeroerd;
      # alleen rapporten/voorbeeld/ wordt opgeslagen. Handig om nieuwe rapportonderdelen meteen te zien.
      - name: Voorbeeldrapport (op een kopie)
        if: github.event.inputs.action == 'voorbeeld'
        run: |
          rm -rf /tmp/kopie rapporten/voorbeeld && cp -r state /tmp/kopie
          export STATE_DIR=/tmp/kopie REPORTS_DIR=rapporten/voorbeeld
          python -m trendagent run || true
          python -m trendagent invest || true
          python -m trendagent overzicht || true
          cp /tmp/kopie/report.md rapporten/voorbeeld/trend-agent-rapport.md 2>/dev/null || true
          cat rapporten/voorbeeld/OVERZICHT.md >> "$GITHUB_STEP_SUMMARY" || true
          git config user.name "trend-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rapporten/voorbeeld
          git commit -m "Voorbeeldrapport $(date -u +%F)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push && break; sleep 15; done

      # De twee bots draaien los van elkaar: een fout in de ene stopt de andere niet.
      - name: Trend-agent
        if: github.event.inputs.action != 'kill' && github.event.inputs.action != 'resume' && github.event.inputs.action != 'voorbeeld'
        continue-on-error: true
        run: python -m trendagent run

      # Oefenaccount (demo) bij Trading 212 volgt de trend-agent. Alleen nepgeld; een fout hier stopt de bots niet.
      - name: Oefenaccount Trading 212
        if: github.event.inputs.action != 'kill' && github.event.inputs.action != 'resume' && github.event.inputs.action != 'voorbeeld'
        continue-on-error: true
        env:
          T212_DEMO_KEY: ${{ secrets.T212_DEMO_KEY }}
          T212_DEMO_SECRET: ${{ secrets.T212_DEMO_SECRET }}
        run: python -m trendagent broker

      - name: Investeerder
        if: github.event.inputs.action != 'kill' && github.event.inputs.action != 'resume' && github.event.inputs.action != 'voorbeeld'
        continue-on-error: true
        run: python -m trendagent invest

      - name: Dagoverzicht
        if: github.event.inputs.action != 'kill' && github.event.inputs.action != 'resume' && github.event.inputs.action != 'voorbeeld'
        continue-on-error: true
        run: python -m trendagent overzicht

      - name: Cijfers voor het dashboard
        if: github.event.inputs.action != 'kill' && github.event.inputs.action != 'resume' && github.event.inputs.action != 'voorbeeld'
        continue-on-error: true
        run: python -m trendagent dashboard

      - name: Samenvatting
        if: always() && github.event.inputs.action != 'voorbeeld'
        run: |
          if [ -f rapporten/OVERZICHT.md ]; then cat rapporten/OVERZICHT.md >> "$GITHUB_STEP_SUMMARY"; fi
          python -m trendagent health >> "$GITHUB_STEP_SUMMARY" || true
          if [ -f state/investeerder.md ]; then cat state/investeerder.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f state/report.md ]; then cat state/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Resultaat opslaan in de repository
        if: always() && github.event.inputs.action != 'voorbeeld'
        run: |
          git config user.name "trend-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/ rapporten/ dashboard/
          if git diff --cached --quiet; then
            echo "Niets gewijzigd."
          else
            git commit -m "Oefenronde $(date -u +%F)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "Opslaan mislukt (poging $i), opnieuw over 15 seconden..."; sleep 15
            done
            git fetch -q origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then echo "Opslaan definitief mislukt"; exit 1; fi
          fi

      # Laatste stap: maakt de run ROOD als een bot faalde of de koersdata onbetrouwbaar was.
      # GitHub stuurt je dan standaard een e-mail.
      - name: Gezondheidscontrole
        if: github.event.inputs.action != 'kill' && github.event.inputs.action != 'resume' && github.event.inputs.action != 'voorbeeld'
        run: python -m trendagent health --check
