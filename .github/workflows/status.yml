# Zet na elke run de lijst van de laatste GitHub-runs (goed of fout) klaar voor het dashboard (tabblad GitHub).
name: status

on:
  workflow_run:
    workflows: [practice, onderzoek, backtest, tests, diagnose, broker]
    types: [completed]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Runs ophalen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: PYTHONPATH=src python -m trendagent.github_status
      - name: Alleen dashboard/github.json opslaan
        run: bash scripts/opslaan.sh "GitHub-status voor het dashboard" dashboard/github.json
