# Zet na elke run de lijst van de laatste GitHub-runs (goed of fout) klaar voor het dashboard (tabblad GitHub).
name: status

on:
  workflow_run:
    workflows: [practice, onderzoek, backtest, tests, diagnose]
    types: [completed]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Runs ophalen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: PYTHONPATH=src python -m trendagent.github_status
      - name: Alleen dashboard/github.json opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/github.json
          git diff --cached --quiet && exit 0
          git commit -m "GitHub-status voor het dashboard"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
