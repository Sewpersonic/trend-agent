# Zet na elke run de lijst van de laatste GitHub-runs (goed of fout) klaar voor het dashboard (tabblad GitHub),
# en werkt de systeemkaart bij (tabblad Systeem): waar het nu knelt, berekend uit de bestanden van de bots.
name: status

on:
  workflow_run:
    workflows: [practice, onderzoek, backtest, tests, diagnose, broker, daytrade, daytrade-sessie, bewaker]
    types: [completed]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Runs ophalen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: PYTHONPATH=src python -m trendagent.github_status
      - name: Systeemkaart bijwerken
        run: |
          git pull -q --rebase origin main || true
          PYTHONPATH=src python -m trendagent.systeem
      - name: Alleen dashboard/github.json en systeem.json opslaan
        run: bash scripts/opslaan.sh "GitHub-status en systeemkaart voor het dashboard" dashboard/github.json dashboard/systeem.json
