# Draait alle tests bij elke wijziging in de code.
name: tests

on:
  push:
    paths-ignore: ["state/**", "rapporten/**", "backtest/**"]   # de dagelijkse oefenronde hoeft geen tests te starten
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -v
        env:
          PAPER_TRADING: "true"
