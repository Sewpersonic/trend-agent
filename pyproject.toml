[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trendagent"
version = "0.1.0"
description = "Trend-agent die oefent met nepgeld (paper trading) in EU- en VS-aandelen"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",   # gratis dagkoersen; alleen gebruikt door 'run' zonder --simulated
    "openpyxl>=3.1",      # Excel-rapport in rapporten/
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
